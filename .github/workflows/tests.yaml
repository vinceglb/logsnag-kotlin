name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: ✅ Run tests on JVM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create local.properties file
        run: |
          echo "LOGSNAG_TOKEN=${{ secrets.LOGSNAG_TOKEN }}" > local.properties
          echo "LOGSNAG_PROJECT=${{ secrets.LOGSNAG_PROJECT }}" >> local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew :logsnag-kotlin:jvmTest

  build:
    name: 📦 Assemble
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build targeted artifacts
        shell: pwsh
        run: .\gradlew :logsnag-kotlin:jvmJar :sample:androidApp:assembleDebug :sample:desktopApp:packageDistributionForCurrentOS
